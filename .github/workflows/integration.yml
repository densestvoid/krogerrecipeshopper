# Go quality checks for pull requests.
# Self-contained mirror of Taskfile ci; densestvoid/workflows go-checks.yml@main
# currently references actions that fail when invoked from consumer repos.

name: Integration

on:
  pull_request:

jobs:
  go-checks:
    name: go-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        run: go tool staticcheck ./...

      - name: Lint
        run: go tool golangci-lint run ./...

      - name: Vulnerability check
        run: go tool govulncheck ./...

      - name: Security check
        run: go tool gosec ./...
